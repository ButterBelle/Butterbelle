<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterBelle - Homemade Bakery & Dessert</title>
    <link rel="icon" type="image/png" href="logo.jpg">
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

   <header>
        <img src="logo.png" alt="ButterBelle Logo" class="logo-img">
        <h1>ButterBelle</h1>
        <p>Homemade Bakery & Dessert</p>
        <p class="alamat-toko">📍 Perum. Graha Sergai Indah, Blok A3 AX Desa Firdaus, Kecamatan Sei Rampah, Serdang Bedagai</p>
    </header>

    <div class="container">
       <!-- Kolom Pencarian (Search Bar dengan Tombol) -->
     <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Cari menu kue kesukaanmu..." oninput="filterKatalog()">
</div>
        <div id="loader" class="loader">Memuat katalog ButterBelle...</div>
        <div id="katalog-grid" class="grid"></div>
    </div>

    <!-- Tombol Hotline & Kerjasama di Bagian Bawah (Footer) -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2025 ButterBelle. All rights reserved.</p>
            <div class="footer-buttons">
                <!-- Tombol Hotline WA -->
                <a href="https://wa.me/6281284622070?text=Halo%20ButterBelle,%20saya%20ingin%20bertanya%20mengenai%20produk." target="_blank" class="btn-footer btn-hotline">
                    📞 Hotline CS
                </a>
                <!-- Tombol Proposal Kerjasama -->
                <button onclick="bukaProposal()" class="btn-footer btn-proposal">
                    📄 Proposal Kerjasama
                </button>
            </div>
        </div>
    </footer>

  <!-- Popup Modal untuk Form Pesanan -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <span class="close-btn" onclick="tutupModal()">&times;</span>
            <h2>Detail Pesanan</h2>
            <form id="formPesanan" onsubmit="kirimPesanan(event)">
                <div class="form-group">
                    <label>Kue yang dipilih:</label>
                    <input type="text" id="inputPesanan" readonly required>
                </div>
                <div class="form-group">
                    <label>Nama Anda:</label>
                    <input type="text" id="inputNama" placeholder="Masukkan nama lengkap" required>
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp:</label>
                    <input type="number" id="inputWA" placeholder="Contoh: 081234567890" required>
                </div>
                <!-- Kolom Tambahan untuk Keterangan/Catatan -->
                <div class="form-group">
                    <label>Keterangan / Catatan (Opsional):</label>
                    <input type="text" id="inputKeterangan" placeholder="Contoh: Tulisan 'Happy Birthday Yuda'">
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">Kirim Pesanan</button>
            </form>
        </div>
    </div>

    <!-- Popup Modal untuk Viewer Proposal (PDF / Dokumen) -->
    <div class="modal-overlay" id="modalProposal">
        <div class="modal-proposal-content">
            <span class="close-btn" onclick="tutupProposal()">&times;</span>
            <h2>Proposal Kerjasama ButterBelle</h2>
            <div class="pdf-viewer-container">
                <!-- Ganti link src di bawah dengan link file PDF kamu (bisa dari Google Drive, Link PDF online, dll) -->
<iframe src="https://docs.google.com/viewer?url=https://butterbelle.github.io/Butterbelle/proposal2.pdf&embedded=true" frameborder="0"></iframe>            </div>
        </div>
    </div>

    <!-- Menghubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
